<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <!-- 페이지 제목 -->
    <title>메모 수정</title>

    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="../static/styles.css">
</head>
<body>

    <!-- 페이지 제목 -->
    <h1>메모 수정</h1>

    <!-- 메모 수정 form -->
    <form method="POST" class="form-box">

        <!-- 제목 수정 -->
        <p>
            <label>제목</label><br>

            <input
                type="text"
                name="title"
                value="{{ memo['title'] }}"
                required
            >
        </p>


        <!-- 내용 수정 -->
        <p>
            <label>내용</label><br>

            <textarea name="content" required>{{ memo["content"] }}</textarea>
        </p>


        <!-- 분류 수정 -->
        <p>
            <label>분류</label><br>

            <select
                name="category"
                id="category"
                onchange="showAmount()"
            >

                <!-- 현재 분류가 학교이면 선택 -->
                <option value="학교"
                    {% if memo["category"] == "학교" %}selected{% endif %}>
                    학교
                </option>

                <!-- 현재 분류가 공부이면 선택 -->
                <option value="공부"
                    {% if memo["category"] == "공부" %}selected{% endif %}>
                    공부
                </option>

                <!-- 현재 분류가 생활이면 선택 -->
                <option value="생활"
                    {% if memo["category"] == "생활" %}selected{% endif %}>
                    생활
                </option>

                <!-- 현재 분류가 기타이면 선택 -->
                <option value="기타"
                    {% if memo["category"] == "기타" %}selected{% endif %}>
                    기타
                </option>

            </select>
        </p>


        <!-- 생활 메모일 때 사용 금액 표시 -->
        <div id="amountBox"
            {% if memo["category"] != "생활" %}
                style="display: none;"
            {% endif %}>

            <p>
                <label>사용 금액</label><br>

                <input
                    type="number"
                    name="amount"
                    value="{{ memo['amount'] if memo['amount'] else '' }}"
                >
            </p>

        </div>


        <!-- 수정 내용 저장 -->
        <button type="submit">수정 완료</button>

    </form>


    <!-- 메인 페이지로 이동 -->
    <p>
        <a href="/">메인으로 돌아가기</a>
    </p>


    <!-- 생활 선택 시 금액 입력칸 표시 -->
    <script src="{{ url_for('static', filename='show_Amount.js') }}"></script>

</body>
</html>
